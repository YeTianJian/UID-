name: Build UID Filter
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          # 在这里补充构建脚本需要的依赖包，如果后面日志提示缺包再加

      - name: Setup Android SDK & NDK 27.3.13750724
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.3.13750724"
          accept-android-sdk-licenses: true

      - name: Set env & debug print
        run: |
          echo "ANDROID_NDK_HOME=$env:ANDROID_SDK_ROOT\ndk\27.3.13750724" >> $env:GITHUB_ENV
          echo "=== Check file exist ==="
          Test-Path tools/uid-seccomp-mod
          ls tools

      - name: Run build script
        run: |
          python tools/uid-seccomp-mod

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: UID-Zygisk-Mod
          path: build/**/*.zip
