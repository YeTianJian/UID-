name: Build UID Filter
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup NDK 27.3.13750724
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.3.13750724"
          accept-android-sdk-licenses: true

      - name: Set NDK env
        shell: pwsh
        run: |
          $ndk = "$env:ANDROID_SDK_ROOT\ndk\27.3.13750724"
          echo "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV
          echo "ANDROID_NDK=$ndk"      >> $env:GITHUB_ENV
          echo "NDK=$ndk"             >> $env:GITHUB_ENV
          Write-Host "NDK at: $ndk"
          Get-ChildItem $ndk | Select-Object -First 6 Name

      - name: Run build.py
        shell: pwsh
        working-directory: tools\uid-seccomp-module
        run: python build.py

      - name: List output zip
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.zip |
            Where-Object { $_.FullName -notmatch '\\.git\\' } |
            Select-Object FullName,Length

      - name: Upload built module zip
        uses: actions/upload-artifact@v4
        with:
          name: UID-seccomp-module
          path: |
            **/*.zip
          if-no-files-found: warn
