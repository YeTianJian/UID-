name: Build UID Filter
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Print repo structure
        shell: pwsh
        run: |
          Write-Host "===== ROOT ====="
          Get-ChildItem -Force | Select-Object Mode,Name
          Write-Host "`n===== ALL FILES (recursive, no .git) ====="
          Get-ChildItem -Recurse -Force | Where-Object { $_.FullName -notmatch '\\.git\\' } | ForEach-Object { $_.FullName.Replace((Get-Location).Path + '\', '') }
